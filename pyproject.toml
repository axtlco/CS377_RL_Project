[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-project"
version = "0.1.0"
description = "Shared DQN experiment foundation for MiniGrid DoorKey."
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=0.29",
  "minigrid>=2.3",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "torch>=2.1",
  "tensorboard>=2.14",
  "setuptools<82",
  "tqdm>=4.66",
  "imageio>=2.34",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
